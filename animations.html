<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes move{
            0%,100%{
                transform: translateY(0px);
            }
            20%{
                transform:translateY(200px);
            }
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: blue;
            animation: move ease infinite;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
